<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>스마트폰 실시간 관제소</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #ffffff; padding: 15px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 2px solid #1e293b; padding-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    h1 { font-size: 1.2rem; font-weight: bold; }
    .controls { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; background: #1e293b; padding: 5px 10px; border-radius: 8px; }
    .controls input { width: 55px; background: #0b0f19; border: 1px solid #475569; color: #fff; padding: 3px 6px; border-radius: 4px; text-align: center; font-size: 0.9rem; font-weight: bold; }
    
    .status-summary { display: flex; gap: 6px; font-size: 0.8rem; flex-wrap: wrap; }
    .status-badge { padding: 4px 8px; border-radius: 6px; font-weight: bold; }
    .badge-online { background: #15803d; color: #ffffff; }
    .badge-warn { background: #d97706; color: #ffffff; }
    .badge-danger { background: #b91c1c; color: #ffffff; }
    .badge-offline { background: #475569; color: #cbd5e1; }

    /* 상단 이상 기기 번호 요약 알림창 */
    .alert-panel { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-size: 0.82rem; }
    .alert-row { padding: 8px 12px; border-radius: 6px; line-height: 1.4; display: flex; align-items: flex-start; gap: 8px; word-break: break-all; }
    .alert-danger { background: rgba(185, 28, 28, 0.25); border: 1px solid #ef4444; color: #fca5a5; }
    .alert-warn { background: rgba(217, 119, 6, 0.25); border: 1px solid #f59e0b; color: #fde68a; }
    .alert-unreg { background: #1e293b; border-left: 4px solid #64748b; color: #cbd5e1; }
    .alert-nums { font-weight: 800; font-size: 0.9rem; }
    .text-danger-bold { color: #ff4d4f; }
    .text-warn-bold { color: #fbbf24; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 8px; }
    .card { border-radius: 10px; padding: 10px 4px; text-align: center; transition: all 0.2s ease; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); border: 2px solid transparent; position: relative; }
    .card.online { background: linear-gradient(145deg, #15803d, #166534); border-color: #22c55e; color: #ffffff; }
    .card.offline { background: linear-gradient(145deg, #7f1d1d, #450a0a); border-color: #ef4444; color: #fee2e2; }
    .card.unregistered { background: #1e293b; border-color: #475569; border-style: dashed; opacity: 0.45; }
    
    .card-title { font-size: 1.15rem; font-weight: 900; margin-bottom: 6px; }
    .card.online .card-title { color: #f0fdf4; border-bottom: 1px solid rgba(255, 255, 255, 0.2); padding-bottom: 3px; }
    .card.offline .card-title { color: #fef2f2; border-bottom: 1px solid rgba(255, 255, 255, 0.2); padding-bottom: 3px; }
    .card.unregistered .card-title { color: #94a3b8; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); padding-bottom: 3px; }
    
    .stat { font-size: 0.76rem; margin-bottom: 3px; display: flex; justify-content: space-between; font-weight: 600; padding: 0 4px; }
    .stat-val { font-weight: 600; }
    .stat-val.text-orange { color: #ff9800 !important; text-decoration: underline; font-weight: 900; text-shadow: 0 0 2px rgba(0,0,0,0.8); }
    .stat-val.text-red { color: #ff3b30 !important; text-decoration: underline; font-weight: 900; text-shadow: 0 0 3px rgba(0,0,0,0.9); }

    .uptime { font-size: 0.68rem; opacity: 0.85; margin-top: 5px; }
    .status-msg { font-size: 0.85rem; font-weight: bold; margin: 12px 0; }

    .btn-delete {
      display: block;
      position: absolute;
      top: 3px;
      right: 3px;
      width: 18px;
      height: 18px;
      background: rgba(0, 0, 0, 0.5);
      color: #fca5a5;
      border: 1px solid #ef4444;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 900;
      line-height: 16px;
      cursor: pointer;
      text-align: center;
      z-index: 20;
    }
    .btn-delete:hover, .btn-delete:active { background: #dc2626; color: #ffffff; transform: scale(1.15); }
  </style>
</head>
<body>
  <header>
    <h1>📱 폰보드 실시간 관제</h1>
    <div class="controls">
      <span>관리수:</span>
      <input type="number" id="targetCount" value="52" min="1" max="500">
      <span>대</span>
    </div>
    <div class="status-summary">
      <span class="status-badge badge-online" id="count-online">정상: 0</span>
      <span class="status-badge badge-warn" id="count-warn">주의: 0</span>
      <span class="status-badge badge-danger" id="count-danger">위험: 0</span>
      <span class="status-badge badge-offline" id="count-offline">끊김: 0</span>
    </div>
  </header>

  <!-- 상단 상태별 번호 목록 요약 영역 -->
  <div class="alert-panel">
    <div class="alert-row alert-danger" id="box-danger">
      <span>🚨</span>
      <div><strong>위험 기기 (온도≥39℃ / 배터리≤50%):</strong> <span class="alert-nums text-danger-bold" id="list-danger">없음</span></div>
    </div>
    <div class="alert-row alert-warn" id="box-warn">
      <span>⚠️</span>
      <div><strong>주의 기기 (온도 36~38.9℃ / 배터리 51~70% / 충전 분리):</strong> <span class="alert-nums text-warn-bold" id="list-warn">없음</span></div>
    </div>
    <div class="alert-row alert-unreg" id="box-unreg">
      <span>📌</span>
      <div><strong>미등록 기기:</strong> <span class="alert-nums" id="list-unreg">확인 중...</span></div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    const RTDB_BASE = "https://phonewebmonitor-7afcb-default-rtdb.europe-west1.firebasedatabase.app";
    const FIREBASE_URL = `${RTDB_BASE}/devices.json`;
    const grid = document.getElementById("grid");
    
    const countOnline = document.getElementById("count-online");
    const countWarn = document.getElementById("count-warn");
    const countDanger = document.getElementById("count-danger");
    const countOffline = document.getElementById("count-offline");

    const listDanger = document.getElementById("list-danger");
    const listWarn = document.getElementById("list-warn");
    const listUnreg = document.getElementById("list-unreg");
    const targetCountInput = document.getElementById("targetCount");

    targetCountInput.addEventListener("input", fetchStatus);

    async function deleteDevice(numFormatted, rawKeys, e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if (!confirm(`[#${numFormatted}] 기기 데이터를 삭제하시겠습니까?`)) return;

      try {
        const promises = rawKeys.map(k => fetch(`${RTDB_BASE}/devices/${k}.json`, { method: "DELETE" }));
        await Promise.all(promises);
        fetchStatus();
      } catch (err) {
        alert("삭제 실패: " + err);
      }
    }

    async function fetchStatus() {
      try {
        const res = await fetch(FIREBASE_URL + "?t=" + Date.now());
        const rawData = await res.json() || {};
        render(rawData);
      } catch (e) {
        console.error("데이터 수신 오류:", e);
      }
    }

    function formatNumber(n) { return n < 10 ? "0" + n : "" + n; }

    function render(rawData) {
      const targetCount = parseInt(targetCountInput.value, 10) || 52;
      
      const mergedData = {};
      const relatedKeysMap = {};

      Object.keys(rawData).forEach(k => {
        const parsed = parseInt(k, 10);
        const normKey = !isNaN(parsed) ? formatNumber(parsed) : k;

        if (!relatedKeysMap[normKey]) relatedKeysMap[normKey] = [];
        relatedKeysMap[normKey].push(k);

        const currentItem = rawData[k];
        if (!mergedData[normKey] || (currentItem.updatedAt > (mergedData[normKey].updatedAt || 0))) {
          mergedData[normKey] = currentItem;
        }
      });

      const finalKeysSet = new Set();
      for (let i = 1; i <= targetCount; i++) finalKeysSet.add(formatNumber(i));
      Object.keys(mergedData).forEach(k => finalKeysSet.add(k));

      const sortedKeys = Array.from(finalKeysSet).sort((a, b) => {
        const numA = parseInt(a, 10), numB = parseInt(b, 10);
        if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
        return a.localeCompare(b);
      });

      grid.innerHTML = "";
      const now = Date.now();
      
      let onlineCount = 0;
      let offlineCount = 0;
      let dangerList = [];
      let warnList = [];
      let unregList = [];

      sortedKeys.forEach(num => {
        const dev = mergedData[num];
        const card = document.createElement("div");
        card.className = "card";

        if (!dev) {
          unregList.push(num);
          card.classList.add("unregistered");
          card.innerHTML = `<div class="card-title">#${num}</div><div class="status-msg" style="color:#94a3b8;">미등록</div><div class="uptime">-</div>`;
        } else {
          const delBtn = document.createElement("div");
          delBtn.className = "btn-delete";
          delBtn.innerText = "✕";
          delBtn.title = "삭제";
          const rawKeys = relatedKeysMap[num] || [num];
          delBtn.onclick = (e) => deleteDevice(num, rawKeys, e);
          card.appendChild(delBtn);

          const isOffline = !dev.updatedAt || (now - dev.updatedAt > 60000);
          if (isOffline) {
            offlineCount++;
            card.classList.add("offline");
            card.innerHTML += `<div class="card-title">#${num}</div><div class="status-msg">끊김</div><div class="uptime">${dev.uptime || '-'}</div>`;
          } else {
            onlineCount++;
            card.classList.add("online");

            const isTempDanger = dev.temp >= 39.0;
            const isBattDanger = dev.batt <= 50;

            const isTempWarn = !isTempDanger && (dev.temp >= 36.0);
            const isBattWarn = !isBattDanger && (dev.batt <= 70);
            const isUsbOff = !dev.plugged;

            if (isTempDanger || isBattDanger) {
              dangerList.push(num);
            } else if (isTempWarn || isBattWarn || isUsbOff) {
              warnList.push(num);
            }

            const tempClass = isTempDanger ? "text-red" : (isTempWarn ? "text-orange" : "");
            const battClass = isBattDanger ? "text-red" : (isBattWarn ? "text-orange" : "");
            const usbClass = isUsbOff ? "text-red" : "";

            card.innerHTML += `
              <div class="card-title">#${num}</div>
              <div class="stat"><span>온도</span><span class="stat-val ${tempClass}">${dev.temp}℃</span></div>
              <div class="stat"><span>배터리</span><span class="stat-val ${battClass}">${dev.batt}%</span></div>
              <div class="stat"><span>충전</span><span class="stat-val ${usbClass}">${dev.plugged ? 'ON' : 'OFF'}</span></div>
              <div class="uptime">${dev.uptime || '-'}</div>
            `;
          }
        }
        grid.appendChild(card);
      });

      // 배지 카운트 반영
      countOnline.innerText = `정상: ${onlineCount - dangerList.length - warnList.length}`;
      countWarn.innerText = `주의: ${warnList.length}`;
      countDanger.innerText = `위험: ${dangerList.length}`;
      countOffline.innerText = `끊김: ${offlineCount}`;

      // 상단 텍스트 목록 즉시 갱신
      listDanger.innerText = dangerList.length > 0 ? dangerList.map(n => '#' + n).join(', ') : '없음 (정상)';
      listWarn.innerText = warnList.length > 0 ? warnList.map(n => '#' + n).join(', ') : '없음 (정상)';
      listUnreg.innerText = unregList.length > 0 ? unregList.map(n => '#' + n).join(', ') : '전체 등록 완료';
    }

    fetchStatus();
    setInterval(fetchStatus, 3000);
  </script>
</body>
</html>
